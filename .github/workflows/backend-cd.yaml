name: Backend CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-cd-main
  cancel-in-progress: true

jobs:
  # ── Job 1: Test ──────────────────────────────────────────────────────────────
  # Runs the full test suite (Testcontainers: PostgreSQL + MongoDB + Redis).
  # ubuntu-latest has Docker daemon built in; TESTCONTAINERS_RYUK_DISABLED avoids
  # the need for privileged mode which is not available on standard runners.
  test:
    name: Test (Testcontainers)
    runs-on: ubuntu-latest

    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      DOCKER_HOST: unix:///var/run/docker.sock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Verify Docker is available (required by Testcontainers)
        run: docker info

      - name: Build and run tests
        run: ./mvnw verify -Dcheckstyle.skip=false

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

  # ── Job 2: Build & Push Docker Image ────────────────────────────────────────
  # Only runs if the test job passes. Builds the production Docker image and
  # pushes it to both DockerHub and GHCR.
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/judicator-api-gateway:v${{ github.run_number }}
            ghcr.io/omnigradelabs/judicator-api-gateway:v${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to VPS ─────────────────────────────────────────────────────
  # SSHes into the VPS and runs the deploy script with the new image tag.
  # Only runs after the image is successfully built and pushed.
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend via script
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_RUN_NUMBER
          script: |
            set -e
            TAG="v${GITHUB_RUN_NUMBER}"
            echo "Starting Deployment for Judicator API Gateway Version: $TAG"

            SCRIPT_PATH="/root/selfhost/judicator/script/deploy.sh"

            if [ -f "$SCRIPT_PATH" ]; then
                chmod +x $SCRIPT_PATH
                $SCRIPT_PATH $TAG
            else
                echo "Error: File $SCRIPT_PATH does not exist. Please provision the server path!"
                exit 1
            fi