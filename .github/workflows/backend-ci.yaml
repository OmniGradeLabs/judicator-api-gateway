name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # Testcontainers requires Docker — ubuntu-latest provides Docker daemon by default.
    # We explicitly set TESTCONTAINERS_RYUK_DISABLED to avoid Ryuk needing privileged mode.
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      DOCKER_HOST: unix:///var/run/docker.sock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Verify Docker is available (required by Testcontainers)
        run: docker info

      - name: Build and run tests
        run: ./mvnw verify -Dcheckstyle.skip=false
